- name: mtr_marketing_monthly
  description: Revenue by customer acquisition channel (first touch) next to marketing spend, per month and country.
    Feeds ROAS, which divides one fact by the other.
  config:
    meta:
      metrics:
        sales_net_of_discounts__is_paid_true:
          type: sum
          sql: case when ${TABLE}.is_paid = true then ${TABLE}.total_sales_net_of_discounts end
          label: Sales net of discounts (AED) where is_paid_true
          description: 'Helper: MetricFlow metric `sales_net_of_discounts` where is paid true.'
          hidden: true
          round: 2
        returns_value__is_paid_true:
          type: sum
          sql: case when ${TABLE}.is_paid = true then ${TABLE}.total_returns_value end
          label: Returns (AED) where is_paid_true
          description: 'Helper: MetricFlow metric `returns_value` where is paid true.'
          hidden: true
          round: 2
        ad_spend:
          type: sum
          sql: ${TABLE}.total_spend
          label: Marketing spend (AED)
          description: (MetricFlow metric `ad_spend`.)
          round: 2
        roas:
          type: number
          sql: (${sales_net_of_discounts__is_paid_true} - ${returns_value__is_paid_true}) / nullif(${ad_spend},
            0)
          label: ROAS (first-touch)
          description: Net revenue from customers acquired through a paid channel / marketing spend. First-touch
            attribution by acquisition channel; see the limitations in docs/business_definitions.md. (MetricFlow
            metric `roas`.)
          round: 2
        sales_net_of_discounts:
          type: sum
          sql: ${TABLE}.total_sales_net_of_discounts
          label: Sales net of discounts (AED)
          description: Gross sales minus discounts, excluding VAT, before returns. (MetricFlow metric `sales_net_of_discounts`.)
          round: 2
          hidden: true
        returns_value:
          type: sum
          sql: ${TABLE}.total_returns_value
          label: Returns (AED)
          description: Refunds excluding VAT, booked on the return date. (MetricFlow metric `returns_value`.)
          round: 2
          hidden: true
        net_revenue:
          type: number
          sql: ${sales_net_of_discounts} - ${returns_value}
          label: Net revenue (AED)
          description: Gross sales - discounts - returns, excluding VAT, in AED. Returns on the return date. (MetricFlow
            metric `net_revenue`.)
          round: 2
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
