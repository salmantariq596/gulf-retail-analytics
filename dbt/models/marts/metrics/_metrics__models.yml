- name: mtr_online_orders_daily
  description: Online orders per placed date, fulfilling store and channel (web/app), with delivery time. Averages
    are stored as sum and count so they stay correct at any grain.
  config:
    meta:
      joins:
      - join: dim_store
        sql_on: ${mtr_online_orders_daily.store_key} = ${dim_store.store_key}
      - join: dim_channel
        sql_on: ${mtr_online_orders_daily.channel_key} = ${dim_channel.channel_key}
      - join: dim_date
        sql_on: ${mtr_online_orders_daily.metric_date} = ${dim_date.date_day}
      metrics:
        online_orders:
          type: sum
          sql: ${TABLE}.total_orders_placed
          label: Online orders placed
          description: (MetricFlow metric `online_orders`.)
          round: 0
        average_delivery_hours__sum:
          type: sum
          sql: ${TABLE}.total_delivery_hours_sum
          label: Average delivery time (hours) (total_delivery_hours_sum)
          description: Helper for MetricFlow metric `average_delivery_hours`.
          hidden: true
          round: 2
        average_delivery_hours__count:
          type: sum
          sql: ${TABLE}.total_delivery_hours_count
          label: Average delivery time (hours) (total_delivery_hours_count)
          description: Helper for MetricFlow metric `average_delivery_hours`.
          hidden: true
          round: 2
        average_delivery_hours:
          type: number
          sql: ${average_delivery_hours__sum} / nullif(${average_delivery_hours__count}, 0)
          label: Average delivery time (hours)
          description: Average hours from placing to delivery, for delivered orders, by placed date. (MetricFlow
            metric `average_delivery_hours`.)
          round: 1
