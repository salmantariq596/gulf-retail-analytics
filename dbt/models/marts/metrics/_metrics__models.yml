    description: 'MetricFlow measure `sales_net_of_discounts` from sales_lines: sum(net_excl_vat_aed)'
    config:
      meta:
        dimension:
          hidden: true
  - name: total_returns_value
    description: 'MetricFlow measure `returns_value` from returns: sum(refund_excl_vat_aed)'
    config:
      meta:
        dimension:
          hidden: true
  - name: total_spend
    description: 'MetricFlow measure `spend` from marketing_spend: sum(spend_aed)'
    config:
      meta:
        dimension:
          hidden: true
  - name: total_clicks
