version: 2

sources:
  - name: erp
    description: >
      Daily CSV drops from the ERP, loaded as text by dlt into `raw_erp` with `_file_name`
      and `_file_date`. About 1% of daily stock files never arrive.
    # DuckDB: raw schemas live in the same file. Snowflake: the separate RAW database.
    database: "{{ var('raw_database') or ('RAW' if target.type == 'snowflake' else target.database) }}"
    schema: raw_erp
    config:
      freshness:
        warn_after: {count: 36, period: hour}
        error_after: {count: 96, period: hour}
      # file for business day d is complete at the end of d
      loaded_at_field: "cast(_file_date as timestamp) + interval '1 day'"
    tables:
      - name: stock_on_hand
        description: End-of-day stock per store and SKU (one file per day).
      - name: purchase_orders
        description: PO lines ordered or received that day; a PO line appears once when ordered and once when received.
