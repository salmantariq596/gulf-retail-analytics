version: 2

sources:
  - name: marketing
    description: >
      Daily spend exports from six ad platforms, appended by dlt into `raw_marketing`. Each file
      restates the previous two days, so the same (date, campaign, country) appears in up to three
      files; the latest file wins (handled in the intermediate layer).
    # DuckDB: raw schemas live in the same file. Snowflake: the separate RAW database.
    database: "{{ var('raw_database') or ('RAW' if target.type == 'snowflake' else target.database) }}"
    schema: raw_marketing
    config:
      freshness:
        warn_after: {count: 36, period: hour}
        error_after: {count: 72, period: hour}
      # file for business day d is complete at the end of d
      loaded_at_field: "cast(_file_date as timestamp) + interval '1 day'"
    tables:
      - name: spend
