version: 2

seeds:
  - name: currency_rates
    description: >
      AED per unit of each currency. All Gulf currencies are pegged to the USD
      (AED 3.6725, SAR 3.75, QAR 3.64), so cross rates are fixed.
    columns:
      - name: currency_code
        data_tests: [unique, not_null]
      - name: aed_per_unit
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true

  - name: vat_rates
    description: VAT rate per country with validity dates (Saudi Arabia went from 5% to 15% on 2020-07-01).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_code, valid_from]
    columns:
      - name: vat_rate
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 0.25

  - name: country_weekends
    description: >
      Weekend days per country (ISO day of week, Monday = 1). The UAE moved from Fri-Sat to
      Sat-Sun on 2022-01-01; KSA and Qatar use Fri-Sat.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [country_code, iso_day_of_week, valid_from]
    columns:
      - name: iso_day_of_week
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
                quote: false

  - name: countries
    columns:
      - name: country_code
        data_tests: [unique, not_null]
      - name: currency_code
        data_tests:
          - relationships:
              arguments:
                to: ref('currency_rates')
                field: currency_code

  - name: hijri_calendar
    description: Gregorian to Hijri (Umm al-Qura) for 2018-2030, generated by `python -m najm_gen.seeds`.
    columns:
      - name: date_day
        data_tests: [unique, not_null]
      - name: hijri_month
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 12

  - name: gulf_holidays
    description: Public holidays and single-day retail peaks per country, generated from the generator's calendar.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [holiday_date, country_code, holiday_name]

  - name: retail_events
    description: Multi-day trading periods (Ramadan, Eid, White Friday week, DSF, back to school).
    data_tests:
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments:
            column_A: end_date
            column_B: start_date
            or_equal: true
    columns:
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["ramadan", "ramadan_peak", "eid", "white_friday", "dsf", "back_to_school"]

  - name: marketing_channels
    description: Marketing / acquisition channels; `organic` covers customers with no paid touch.
    columns:
      - name: marketing_channel
        data_tests: [unique, not_null]
