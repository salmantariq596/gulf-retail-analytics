# Self-hosted Lightdash (BI) for the Gulf Retail warehouse.
# Based on github.com/lightdash/lightdash/blob/main/docker-compose.yml, trimmed for local use:
#   - versions pinned; ports bound to localhost only
#   - no headless-browser service (only needed for scheduled PDF/image deliveries)
# Start with:  .\bi\lightdash\up.ps1   (creates .env with random secrets on first run)
name: najm-lightdash

services:
  lightdash:
    image: lightdash/lightdash:3.393.0
    platform: linux/amd64
    depends_on: [db, minio]
    restart: unless-stopped
    environment:
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=${PGPASSWORD:?run up.ps1 to create .env}
      - PGDATABASE=postgres
      - LIGHTDASH_SECRET=${LIGHTDASH_SECRET:?run up.ps1 to create .env}
      - SITE_URL=http://localhost:8080
      - PORT=8080
      - SECURE_COOKIES=false
      - TRUST_PROXY=false
      - LIGHTDASH_LOG_LEVEL=info
      - LIGHTDASH_QUERY_MAX_LIMIT=5000
      - SCHEDULER_ENABLED=true
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET=default
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:?run up.ps1 to create .env}
      - S3_FORCE_PATH_STYLE=true
      # No LD_SETUP_* headless setup: it insists on a Databricks project. up.ps1 registers
      # the admin and creates the CLI token through the API instead (bootstrap.ps1).
    ports:
      - "127.0.0.1:8080:8080"

  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${PGPASSWORD:?run up.ps1 to create .env}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    volumes:
      - lightdash-db:/var/lib/postgresql/data

  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?run up.ps1 to create .env}
      - MINIO_DEFAULT_BUCKETS=default
      - MINIO_EXPIRATION_DAYS=1
    volumes:
      - ./init-minio.sh:/init-minio.sh:ro

volumes:
  lightdash-db:
